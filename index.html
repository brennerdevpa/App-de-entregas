    .report-table th, .report-table td{ white-space:normal; }

</style>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDKdV4laGoPMGz2hz-rUd77OIp4BsiX0s0",
  authDomain: "appmotoboys.firebaseapp.com",
  databaseURL: "https://appmotoboys-default-rtdb.firebaseio.com",
  projectId: "appmotoboys",
  storageBucket: "appmotoboys.firebasestorage.app",
  messagingSenderId: "138452699945",
  appId: "1:138452699945:web:09e5b28d1d405cb599c538"
};

let db, DOC_REF, docListener = null;
let firebaseOk = false;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  DOC_REF = db.ref('estado');
  firebaseOk = true;
}catch(e){
  console.error('Erro ao inicializar Firebase', e);
}

const VALORES = { cidade: 3, estrada: 6 };

let state = {
  view: 'login',
  driverInput: '',
  driverPendingName: '',
  currentDriver: null,
  driverPeriodo: 'dia',
  data: { motoboys: [], entregas: [], descontos: [] },
  novoCliente: '',
  novoTipo: 'cidade',
  editingId: null,
  editCliente: '',
  editTipo: 'cidade',
  confirmDeleteId: null,
  adminPasswordInput: '',
  adminError: '',
  adminSenha: '1234',
  adminChangeError: '',
  adminAlerts: (() => { try{ return localStorage.getItem('appmotoboys_alertas_admin') === '1'; }catch(e){ return false; } })(),
  adminAlertError: '',
  liveAlert: null,
  driverError: '',
  changeError: '',
  openDriverSection: null,
  periodos: {},
  horarios: {},
  descontoErro: '',
  saveError: '',
  descInputs: {},
  confirmDeleteDescontoId: null,
  confirmDeleteDriverName: null,
  relatorio: null,
  loaded: false,
  dataReady: false
};

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function formatMoney(v){
  const valor = Number(v);
  return 'R$ ' + (Number.isFinite(valor) ? valor : 0).toFixed(2).replace('.', ',');
}

function formatHorario(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function formatHora(iso){
  return new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

// ---------- períodos (diário / semanal / mensal) ----------

function isSameDay(d, ref){
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
}

function startOfWeek(ref){
  const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const dia = d.getDay();
  const diff = (dia === 0 ? -6 : 1) - dia;
  d.setDate(d.getDate() + diff);
  return d;
}

function startOfMonth(ref){
  return new Date(ref.getFullYear(), ref.getMonth(), 1);
}

function filterByPeriod(items, periodo, campoData){
  if(periodo === 'tudo') return items;
  const agora = new Date();
  return items.filter(item => {
    const d = new Date(item[campoData]);
    if(periodo === 'dia') return isSameDay(d, agora);
    if(periodo === 'semana'){
      const inicio = startOfWeek(agora);
      const fim = new Date(inicio); fim.setDate(inicio.getDate() + 7);
      return d >= inicio && d < fim;
    }
    if(periodo === 'mes'){
      const inicio = startOfMonth(agora);
      const fim = new Date(inicio.getFullYear(), inicio.getMonth() + 1, 1);
      return d >= inicio && d < fim;
    }
    return true;
  });
}

function periodoLabel(periodo){
  const agora = new Date();
  if(periodo === 'dia') return agora.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'2-digit', year:'numeric'});
  if(periodo === 'semana'){
    const inicio = startOfWeek(agora);
    const fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);
    return 'Semana de ' + inicio.toLocaleDateString('pt-BR') + ' a ' + fim.toLocaleDateString('pt-BR');
  }
  if(periodo === 'mes') return agora.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  return 'Todo o período';
}

function getPeriodo(idx){
  return (state.periodos && state.periodos[idx]) || 'dia';
}

function getHorarioFiltro(idx){
  return (state.horarios && state.horarios[idx]) || { inicio: '', fim: '' };
}

function filterByHour(items, inicio, fim, campoData){
  if(!inicio && !fim) return items;
  const paraMinutos = valor => {
    const [hora, minuto] = valor.split(':').map(Number);
    return hora * 60 + minuto;
  };
  const inicioMin = inicio ? paraMinutos(inicio) : null;
  const fimMin = fim ? paraMinutos(fim) : null;
  return items.filter(item => {
    const data = new Date(item[campoData]);
    const minutos = data.getHours() * 60 + data.getMinutes();
    if(inicioMin !== null && fimMin !== null){
      return inicioMin <= fimMin
        ? minutos >= inicioMin && minutos <= fimMin
        : minutos >= inicioMin || minutos <= fimMin;
    }
    return inicioMin !== null ? minutos >= inicioMin : minutos <= fimMin;
  });
}

function normalizarDados(){
  if(!state.data.motoboys) state.data.motoboys = [];
  if(!state.data.entregas) state.data.entregas = [];
  if(!state.data.descontos) state.data.descontos = [];
  state.data.motoboys = state.data.motoboys.map(m => typeof m === 'string' ? { nome: m, senha: null } : m);
  state.data.entregas = state.data.entregas
    .filter(e => e && e.id && e.motoboy && e.cliente)
    .map(e => ({ ...e, valor: Number(e.valor) || VALORES[e.tipo] || 0 }));
  state.data.descontos = state.data.descontos
    .filter(d => d && d.id && d.motoboy)
    .map(d => ({ ...d, valor: Number(d.valor) || 0 }));
  state.adminSenha = state.data.adminSenha || '1234';
}

let inicializacaoConcluida = false;
let entregasObservadas = null;
let miniTela = null;
let miniTimer = null;

async function inicializarFirebase(){
  state.loaded = true;
  render();

  if(!firebaseOk){
    document.getElementById('app').innerHTML = '<div class="error-msg" style="margin:40px auto; max-width:400px;">Falha ao ligar ao Firebase. Verifique a consola (F12) e a sua ligação à internet.</div>';
    return;
  }

  iniciarListener();
  let snap = null;
  try{
    snap = await DOC_REF.once('value');
  }catch(e){
    console.error('Erro ao ler dados do Realtime Database', e);
  }
  if(snap && snap.exists()){
    state.data = snap.val();
    normalizarDados();
    state.dataReady = true;
    render();
  }else{
    try{
      await DOC_REF.set(state.data);
      state.dataReady = true;
    }catch(e){
      console.error('Erro ao criar dados no Realtime Database', e);
      state.saveError = 'Não foi possível iniciar os dados no Firebase. Verifique a ligação e as permissões do banco de dados.';
      render();
    }
  }
  inicializacaoConcluida = true;
  restauraSessaoMotorista();
  restauraSessaoAdmin();
}

function iniciarListener(){
  if(docListener){
    DOC_REF.off('value', docListener);
  }
  docListener = snap => {
    const novos = snap.val();
    if(novos){
      const entregasNovas = novos.entregas || [];
      if(entregasObservadas === null){
        entregasObservadas = new Set(entregasNovas.map(e => e.id));
      }else{
        const adicionadas = entregasNovas.filter(e => e && e.id && !entregasObservadas.has(e.id));
        entregasObservadas = new Set(entregasNovas.map(e => e.id));
        if(adicionadas.length) avisarNovasEntregas(adicionadas);
      }
      const atual = JSON.stringify(state.data);
      if(JSON.stringify(novos) !== atual){
        state.data = novos;
        normalizarDados();
        state.dataReady = true;
        render();
      }
    }
  };
  DOC_REF.on('value', docListener, err => {
    console.error('Erro no listener do Realtime Database', err);
    state.saveError = 'A sincronização com o Firebase falhou. Verifique a ligação e tente recarregar a página.';
    render();
  });
}

async function saveData(){
  try{
    await DOC_REF.set(state.data);
    state.saveError = '';
  }catch(e){
    console.error('Erro ao salvar no Realtime Database', e);
    state.saveError = 'Não foi possível guardar a alteração. Verifique a ligação e tente novamente.';
    render();
  }
}

function restauraSessaoAdmin(){

  if(state.view === 'driverDashboard') return;
  let sessao;
  try{ sessao = JSON.parse(localStorage.getItem('appmotoboys_admin')); }catch(e){ limparSessaoAdmin(); return; }
  if(!sessao) return;
  if(sessao.data !== todayStr()){

  }
  state.view = 'adminDashboard';
  state.adminError = '';

function restauraSessaoMotorista(){
  const sessao = sessaoMotoristaSalva();
  if(!sessao) return;
  let dados;
  try{ dados = JSON.parse(sessao); }catch(e){ limparSessaoMotorista(); return; }
  if(!dados.nome || dados.data !== todayStr()){
    limparSessaoMotorista();
    return;
  }
  const nome = dados.nome;
  const m = state.data.motoboys.find(x => x.nome.toLowerCase() === nome.toLowerCase());
  if(m){
    state.currentDriver = m.nome;
    state.view = 'driverDashboard';
    state.driverError = '';
    render();
  }else{
    limparSessaoMotorista();
  }

function avisarNovasEntregas(entregas){
  if(!state.adminAlerts || !['adminDashboard', 'adminReport'].includes(state.view)) return;
  const ultima = entregas[entregas.length - 1];
  const quantidade = entregas.length;
  const mensagem = quantidade === 1
    ? `${ultima.motoboy} registrou uma entrega para ${ultima.cliente}.`
    : `${quantidade} novas entregas foram registradas.`;
  state.liveAlert = { mensagem };
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('Nova entrega', { body: mensagem, tag: 'appmotoboys-nova-entrega' });
  }
  render();
  setTimeout(() => {
    if(state.liveAlert && state.liveAlert.mensagem === mensagem){
      state.liveAlert = null;
      render();
    }
  }, 6500);
}

async function abrirMiniTela(){
  if(!window.documentPictureInPicture){
    state.adminAlertError = 'A mini tela sempre no topo funciona no Chrome ou Edge atualizados.';
    render();
    return;
  }
  try{
    miniTela = await window.documentPictureInPicture.requestWindow({ width: 360, height: 420, preferInitialWindowPlacement: true });
    miniTela.document.title = 'Registo de Entregas';
    miniTela.addEventListener('pagehide', () => {
      miniTela = null;
      if(miniTimer){ clearInterval(miniTimer); miniTimer = null; }
      render();
    });
    if(miniTimer) clearInterval(miniTimer);
    miniTimer = setInterval(atualizarMiniTela, 800);
    atualizarMiniTela();
    render();
  }catch(e){
    console.error('Não foi possível abrir a mini tela', e);
    state.adminAlertError = 'Não foi possível abrir a mini tela. Tente novamente.';
    render();
  }
}

function atualizarMiniTela(){
  if(!miniTela || miniTela.closed) return;
  const entregas = [...state.data.entregas].sort((a,b) => new Date(b.horario) - new Date(a.horario));
  const recentes = entregas.slice(0, 4);
  const temAviso = recentes.some(e => e.aviso);
  const avisoBanner = temAviso
    ? '<div class="notice">Entregador na frente — avisar cliente!</div>'
    : '';
  const itens = recentes.length
    ? recentes.map(e => `
      <div class="item ${e.aviso ? 'aviso' : ''}">
        <b>${escapeHtml(e.motoboy)}${e.aviso ? ' <span class="flag">NA FRENTE</span>' : ''}</b>
        <span>${escapeHtml(e.cliente)} · ${formatMoney(e.valor)}</span>
        <small>${formatHorario(e.horario)}</small>
      </div>`).join('')
    : '<p class="empty">Aguardando entregas…</p>';
  miniTela.document.body.innerHTML = `
    <style>
      *{box-sizing:border-box} body{margin:0;padding:18px;background:#f4f7f5;color:#15201c;font-family:Arial,sans-serif}
      header{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px} h1{font-size:17px;margin:0 0 4px;letter-spacing:-.4px} p{margin:0;color:#71807a;font-size:12px}
      .count{padding:7px 10px;border-radius:10px;background:#b8f35a;font-size:12px;font-weight:700}.item{background:#fff;border:1px solid #e3e9e5;border-radius:12px;padding:11px;margin-bottom:8px}.item b,.item span,.item small{display:block}.item b{font-size:13px}.item span{font-size:12px;margin:3px 0}.item small{color:#71807a;font-size:10px}.empty{padding:25px 0;text-align:center}
      .notice{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:#e65545;color:#fff;font-weight:700;font-size:12px;text-align:center;animation:blink 1s ease-in-out infinite}
      .flag{color:#e65545;font-size:10px;margin-left:4px;vertical-align:middle}.item.aviso{border-color:#e65545;background:#ffe3df;box-shadow:0 0 0 3px rgba(230,85,69,.3);animation:blink 1s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
    </style>
    <header><div><h1>Entregas ao vivo</h1><p>Monitor do administrador</p></div><div class="count">${entregas.length} entregas</div></header>
    ${avisoBanner}
    ${itens}`;
}

// ---------- renderização ----------

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = '<div class="loading">Carregando...</div>';
    return;
  }

  // guarda a posição do cursor do campo ativo, para não o perder
  // caso a tela precise de ser reconstruída enquanto se escreve
  const activo = document.activeElement;
  const activoId = activo && activo.id;
  const selStart = (activo && typeof activo.selectionStart === 'number') ? activo.selectionStart : null;
  const selEnd = (activo && typeof activo.selectionEnd === 'number') ? activo.selectionEnd : null;

  if(state.view === 'login') renderLogin(app);
  else if(state.view === 'driverName') renderDriverName(app);
  else if(state.view === 'driverSetPassword') renderDriverSetPassword(app);
  else if(state.view === 'driverLoginPassword') renderDriverLoginPassword(app);
  else if(state.view === 'driverChangePassword') renderDriverChangePassword(app);
  else if(state.view === 'driverDashboard') renderDriverDashboard(app);
  else if(state.view === 'adminLogin') renderAdminLogin(app);
  else if(state.view === 'adminChangePassword') renderAdminChangePassword(app);
  else if(state.view === 'adminDashboard') renderAdminDashboard(app);
  else if(state.view === 'adminReport') renderAdminReport(app);

  if(state.saveError){
    app.insertAdjacentHTML('afterbegin', `<div class="error-msg">${escapeHtml(state.saveError)}</div>`);
  }
  if(state.liveAlert){
    app.insertAdjacentHTML('beforeend', `<div class="live-alert" role="status"><b>Nova entrega recebida</b>${escapeHtml(state.liveAlert.mensagem)}</div>`);
  }
  atualizarMiniTela();

  if(activoId){
    const el = document.getElementById(activoId);
    if(el && el !== document.activeElement){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function renderLogin(app){
  app.innerHTML = `
    <div>
      <div class="brand">Registo de Entregas</div>
      <div class="brand-sub">Controle de entregas dos motoboys</div>
      <button class="tile tile-driver" onclick="goDriverName()">
        Sou entregador
        <small>Registar as minhas entregas</small>
      </button>
      <button class="tile tile-admin" onclick="goAdminLogin()">
        Sou administrador
        <small>Ver entregas de todos os entregadores</small>
      </button>
    </div>
    <div class="footer-note">Os dados ficam guardados e são partilhados entre todos os dispositivos que abrirem esta aplicação.</div>
  `;
}

function renderDriverName(app){
  const conhecido = (perfilConhecido() || '').toLowerCase();
  const perfis = state.data.motoboys
    .map((m, idx) => ({ m, idx }))
    .sort((a, b) => a.m.nome.localeCompare(b.m.nome, 'pt-BR'))
    .map(({ m, idx }) => {
      const ehConhecido = m.nome.toLowerCase() === conhecido;
      return `<button class="tile ${ehConhecido ? 'tile-driver' : 'tile-admin'}" style="margin-bottom:10px; padding:16px; font-size:16px;" onclick="selecionarMotorista(${idx})">
        ${escapeHtml(m.nome)}
        <small>${ehConhecido ? 'Este é o meu perfil — entrar sem senha' : 'Toque para entrar com senha'}</small>
      </button>`;
    }).join('');

  app.innerHTML = `
    <div>
      <div class="topbar">
        <h1>Olá, ${escapeHtml(state.currentDriver)}</h1>
        <div class="header-actions">
          <button class="header-action" onclick="goChangePassword()" aria-label="Alterar senha" title="Alterar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="11" x="5" y="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>

      </div>

      <div class="stat-row">
        <div class="stat"><b>${minhas.length}</b><span>entregas</span></div>
        <div class="stat"><b>${formatMoney(total)}</b><span>a receber</span></div>

        <button class="period-btn ${periodo==='mes' ? 'active' : ''}" onclick="setDriverPeriodo('mes')">Mensal</button>

          </div>
          <div class="type-btn ${state.novoTipo==='estrada' ? 'active-estrada' : ''}" onclick="setNovoTipo('estrada')">
            Estrada<span>${formatMoney(VALORES.estrada)}</span>
          </div>
        </div>
        ${state.driverError ? `<div class="error-msg">${state.driverError}</div>` : ''}
        <button class="btn btn-primary" onclick="enviarEntrega()">Enviar entrega</button>
      </div>

      <h2 style="font-size:15px; margin: 4px 0 10px;">Minhas entregas · ${periodoLabel(periodo)}</h2>

  if(ci) ci.focus();

function renderEntregaItem(e){

  if(isEditing){
    return `
      <div class="entrega-item">
        <label>Cliente</label>
        <input type="text" id="editClienteInput_${e.id}" value="${escapeHtml(state.editCliente)}">
        <label>Tipo de entrega</label>
        <div class="type-row">
          <div class="type-btn ${state.editTipo==='cidade' ? 'active-cidade' : ''}" onclick="setEditTipo('cidade')">
            Cidade<span>${formatMoney(VALORES.cidade)}</span>
          </div>
          <div class="type-btn ${state.editTipo==='estrada' ? 'active-estrada' : ''}" onclick="setEditTipo('estrada')">
            Estrada<span>${formatMoney(VALORES.estrada)}</span>
          </div>
        </div>
        <div class="entrega-actions">
          <button class="mini-btn mini-edit" onclick="salvarEdit('${e.id}')">Guardar</button>
          <button class="mini-btn mini-del" onclick="cancelEdit()">Cancelar</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="entrega-item">
      <div class="entrega-top">
        <div>
          <div class="entrega-cliente">${escapeHtml(e.cliente)}</div>
          <div class="entrega-meta">${formatHorario(e.horario)}</div>
        </div>
        <span class="badge badge-${e.tipo}">${e.tipo === 'cidade' ? 'Cidade' : 'Estrada'}</span>
      </div>
      <div class="entrega-valor">${formatMoney(e.valor)}</div>
      <div class="entrega-actions">
        ${e.aviso ? `
          <button class="mini-btn mini-frente-on" onclick="avisarFrente('${e.id}')">Aviso enviado — tocar para cancelar</button>
        ` : `
          <button class="mini-btn mini-frente" onclick="avisarFrente('${e.id}')">Avisar que estou na frente</button>

      </div>
      <div class="entrega-actions">
        ${isConfirmingDelete ? `
          <button class="mini-btn mini-confirm" onclick="confirmDelete('${e.id}')">Confirmar apagar</button>
          <button class="mini-btn mini-del" onclick="cancelDelete()">Cancelar</button>
        ` : `
          <button class="mini-btn mini-edit" onclick="startEdit('${e.id}')">Ajustar</button>
          <button class="mini-btn mini-del" onclick="askDelete('${e.id}')">Apagar</button>
        `}
      </div>
    </div>
  `;
}

function renderAdminDashboard(app){
  const motoboys = state.data.motoboys;
  const todas = state.data.entregas;
  const todosDescontos = state.data.descontos;
  const totalBrutoGeral = todas.reduce((s,e) => s + e.valor, 0);
  const totalDescontosGeral = todosDescontos.reduce((s,d) => s + d.valor, 0);
  const totalLiquidoGeral = totalBrutoGeral - totalDescontosGeral;

  let corpo = '';
  if(motoboys.length === 0){
    corpo = '<div class="empty">Ainda não há entregadores registados.</div>';
  }else{
    corpo = motoboys.map((m, idx) => {
      const nome = m.nome;
      const entregasTodas = todas
        .filter(e => e.motoboy === nome)
        .sort((a,b) => new Date(b.horario) - new Date(a.horario));
      const descontosTodos = todosDescontos
        .filter(d => d.motoboy === nome)
        .sort((a,b) => new Date(b.data) - new Date(a.data));
      const totalBrutoAll = entregasTodas.reduce((s,e) => s + e.valor, 0);
      const totalDescontosAll = descontosTodos.reduce((s,d) => s + d.valor, 0);
      const totalLiquidoAll = totalBrutoAll - totalDescontosAll;

      const aberto = state.openDriverSection === nome;
      const periodo = getPeriodo(idx);
      const horario = getHorarioFiltro(idx);
      const entregasPeriodo = filterByHour(filterByPeriod(entregasTodas, periodo, 'horario'), horario.inicio, horario.fim, 'horario');
      const descontosPeriodo = filterByHour(filterByPeriod(descontosTodos, periodo, 'data'), horario.inicio, horario.fim, 'data');
      const totalBrutoPeriodo = entregasPeriodo.reduce((s,e) => s + e.valor, 0);
      const totalDescontosPeriodo = descontosPeriodo.reduce((s,d) => s + d.valor, 0);
      const totalLiquidoPeriodo = totalBrutoPeriodo - totalDescontosPeriodo;

      let corpoAberto = '';
      if(aberto){
        const itensEntregas = entregasPeriodo.length === 0
          ? '<div class="empty">Sem entregas neste período.</div>'
          : entregasPeriodo.map(e => `
              <div class="entrega-item ${e.aviso ? 'aviso-frente blink' : ''}">
                <div class="entrega-top">
                  <div>
                    <div class="entrega-cliente">${escapeHtml(e.cliente)}</div>
                    <div class="entrega-meta">${formatHorario(e.horario)}</div>
                  </div>
                  <span class="badge badge-${e.tipo}">${e.tipo === 'cidade' ? 'Cidade' : 'Estrada'}</span>
                </div>
                <div class="entrega-valor">${formatMoney(e.valor)}</div>
                ${e.aviso ? `<div style="margin-top:8px;"><span class="badge badge-frente">Entregador na frente — avisar cliente</span></div>` : ''}
              </div>
            `).join('');

        const itensDescontos = descontosPeriodo.length === 0
          ? '<div class="empty">Nenhum desconto lançado.</div>'
          : descontosPeriodo.map(d => `
              <div class="entrega-item">
                <div class="entrega-top">
                  <div>
                    <div class="entrega-cliente">${escapeHtml(d.descricao)}</div>
                    <div class="entrega-meta">${formatHorario(d.data)}</div>
                  </div>
                  <span class="badge badge-desconto">Desconto</span>
                </div>
                <div class="entrega-valor" style="color: var(--tomato);">- ${formatMoney(d.valor)}</div>
                <div class="entrega-actions">
                  ${state.confirmDeleteDescontoId === d.id ? `
                    <button class="mini-btn mini-confirm" onclick="confirmDeleteDesconto('${d.id}')">Confirmar remover</button>
                    <button class="mini-btn mini-del" onclick="cancelDeleteDesconto()">Cancelar</button>
                  ` : `
                    <button class="mini-btn mini-del" onclick="askDeleteDesconto('${d.id}')">Remover</button>
                  `}
                </div>
              </div>
            `).join('');

        corpoAberto = `
            <div class="driver-body">
            <div class="period-row">
              <div class="period-btn ${periodo==='mes' ? 'active' : ''}" onclick="setPeriodo(${idx},'mes')">Mensal</div>
              <div class="period-btn ${periodo==='dia' ? 'active' : ''}" onclick="setPeriodo(${idx},'dia')">Diário</div>
              <div class="period-btn ${periodo==='semana' ? 'active' : ''}" onclick="setPeriodo(${idx},'semana')">Semanal</div>
            </div>
            <div class="section-title">Filtrar por turno (opcional)</div>
            <div class="time-filter">
              <label>Início<input type="time" id="turnoInicio_${idx}" value="${horario.inicio}"></label>
              <label>Fim<input type="time" id="turnoFim_${idx}" value="${horario.fim}"></label>
            </div>
            <div class="time-filter-actions">
              <button class="btn btn-secondary" onclick="aplicarFiltroHorario(${idx})">Aplicar horário</button>
              ${(horario.inicio || horario.fim) ? `<button class="btn btn-secondary" onclick="limparFiltroHorario(${idx})">Limpar</button>` : ''}
            </div>
            <div class="stat-row">
              <div class="stat"><b>${formatMoney(totalBrutoPeriodo)}</b><span>bruto no período</span></div>
              <div class="stat"><b>-${formatMoney(totalDescontosPeriodo)}</b><span>descontos</span></div>
              <div class="stat"><b>${formatMoney(totalLiquidoPeriodo)}</b><span>a pagar</span></div>
            </div>
            <button class="btn btn-secondary" style="margin-bottom:16px;" onclick="abrirRelatorio(${idx})">Gerar relatório</button>
            ${state.confirmDeleteDriverName === nome ? `
              <div class="card" style="background:#fff5f3; border-color:#facfc8; padding:14px;">
                <div style="font-size:13px; font-weight:700; margin-bottom:4px;">Apagar perfil ${escapeHtml(nome)}?</div>
                <div style="font-size:12px; color:var(--ink-soft); margin-bottom:12px;">Isto remove também todas as entregas e descontos deste entregador. Não é possível desfazer.</div>
                <button class="btn btn-secondary" style="margin:0; background:var(--tomato); border-color:var(--tomato); color:#fff;" onclick="confirmDeleteDriver('${escapeAttr(nome)}')">Confirmar apagar</button>
                <button class="btn btn-secondary" onclick="cancelDeleteDriver()">Cancelar</button>
              </div>
            ` : `
              <button class="btn btn-secondary" style="margin-bottom:16px; background:#fff5f3; border-color:#facfc8; color:var(--tomato);" onclick="askDeleteDriver('${escapeAttr(nome)}')">Apagar perfil</button>
            `}

            <div class="section-title">Entregas no período selecionado${horario.inicio || horario.fim ? ` · ${horario.inicio || '00:00'} às ${horario.fim || '23:59'}` : ''}</div>
            ${itensEntregas}

            <div class="section-title">Lançar desconto (ex: sangria)</div>
            <label>Descrição</label>
            <input type="text" id="descDescricao_${idx}" placeholder="Ex: Sangria do dia" value="${escapeHtml(state.descInputs['d_'+idx] || '')}">
            <label>Valor (R$)</label>
            <input type="text" id="descValor_${idx}" placeholder="Ex: 20" inputmode="decimal" value="${escapeHtml(state.descInputs['v_'+idx] || '')}">
            ${state.descontoErro ? `<div class="error-msg">${state.descontoErro}</div>` : ''}
            <button class="btn btn-secondary" onclick="adicionarDesconto(${idx})">Adicionar desconto</button>

            <div class="section-title">Descontos no período selecionado</div>
            ${itensDescontos}
          </div>
        `;
      }

      let previaHtml = '';
      if(!aberto && entregasTodas.length){
        const recentes = entregasTodas.slice(0, 3);
        previaHtml = `
          <div class="driver-preview">
            ${recentes.map(e => `
              <div class="preview-item ${e.aviso ? 'aviso-frente blink' : ''}">
                <span class="preview-cliente">${escapeHtml(e.cliente)}</span>
                <span class="preview-meta">${e.tipo === 'cidade' ? 'Cidade' : 'Estrada'} · ${formatHora(e.horario)}${e.aviso ? ' · NA FRENTE' : ''}</span>
              </div>
            `).join('')}
            ${entregasTodas.length > 3 ? `<div class="preview-more">+ ${entregasTodas.length - 3} mais — toque para expandir</div>` : ''}
          </div>
        `;
      }

      return `
        <div class="driver-section">
          <div class="driver-header" onclick="toggleDriverSection('${escapeAttr(nome)}')">
            <b>${escapeHtml(nome)} · ${entregasTodas.length} entrega${entregasTodas.length===1?'':'s'}</b>
            <span class="amount">${formatMoney(totalLiquidoAll)}</span>
          </div>
          ${corpoAberto || previaHtml}
        </div>
      `;
    }).join('');
  }

  app.innerHTML = `
    <div>
      <div class="topbar">
        <h1>Painel do administrador</h1>
        <div class="header-actions">
          <button class="header-action" onclick="goAdminChangePassword()" aria-label="Alterar senha" title="Alterar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="11" x="5" y="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
          <button class="header-action exit" onclick="goLogin()" aria-label="Sair" title="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-5"/></svg></button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><b>${motoboys.length}</b><span>entregadores</span></div>
        <div class="stat"><b>${todas.length}</b><span>entregas</span></div>
        <div class="stat"><b>${formatMoney(totalLiquidoGeral)}</b><span>total a pagar</span></div>
      </div>
      <div class="card alert-control">
        <div class="alert-control-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></div>
        <div class="alert-control-copy"><b>Alertas de novas entregas</b>${state.adminAlerts ? 'Ativos neste navegador.' : 'Receba um pop-up mesmo trabalhando em outra aba.'}${state.adminAlertError ? `<br><span style="color:var(--tomato);">${escapeHtml(state.adminAlertError)}</span>` : ''}</div>
        <button class="btn btn-secondary" onclick="abrirMiniTela()">${miniTela && !miniTela.closed ? 'Aberta' : 'Mini tela'}</button>
        ${state.adminAlerts ? '<button class="btn btn-secondary" onclick="desativarAlertasAdmin()">Desativar</button>' : '<button class="btn btn-secondary" onclick="ativarAlertasAdmin()">Ativar</button>'}
      </div>
      ${corpo}
    </div>
  `;
}

function renderAdminReport(app){
  const idx = state.relatorio.idx;
  const m = state.data.motoboys[idx];
  if(!m){
    fecharRelatorio();
    return;
  }
  const periodo = state.relatorio.periodo;
  const inicio = state.relatorio.inicio || '';
  const fim = state.relatorio.fim || '';

  const entregasM = state.data.entregas.filter(e => e.motoboy === m.nome);
  const descontosM = state.data.descontos.filter(d => d.motoboy === m.nome);
  const entregasP = filterByHour(filterByPeriod(entregasM, periodo, 'horario'), inicio, fim, 'horario').sort((a,b) => new Date(a.horario) - new Date(b.horario));
  const descontosP = filterByHour(filterByPeriod(descontosM, periodo, 'data'), inicio, fim, 'data').sort((a,b) => new Date(a.data) - new Date(b.data));

  const totalBruto = entregasP.reduce((s,e) => s + e.valor, 0);
  const totalDesc = descontosP.reduce((s,d) => s + d.valor, 0);
  const totalLiquido = totalBruto - totalDesc;

  const linhasEntregas = entregasP.length === 0
    ? `<tr><td colspan="4" style="color:var(--ink-soft);">Nenhuma entrega neste período.</td></tr>`
    : entregasP.map(e => `
        <tr>
          <td>${formatHorario(e.horario)}</td>
          <td>${escapeHtml(e.cliente)}</td>
          <td>${e.tipo === 'cidade' ? 'Cidade' : 'Estrada'}</td>
          <td>${formatMoney(e.valor)}</td>
        </tr>
      `).join('');

  const linhasDescontos = descontosP.length === 0
    ? `<tr><td colspan="3" style="color:var(--ink-soft);">Nenhum desconto neste período.</td></tr>`
    : descontosP.map(d => `
        <tr>
          <td>${formatHorario(d.data)}</td>
          <td>${escapeHtml(d.descricao)}</td>
          <td>- ${formatMoney(d.valor)}</td>
        </tr>
      `).join('');

  app.innerHTML = `
    <div>
      <div class="no-print" style="display:flex; flex-wrap:wrap; gap:10px; justify-content: space-between; align-items:center; margin-bottom: 14px;">
        <button class="back-btn" onclick="fecharRelatorio()" aria-label="Voltar" title="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg></button>
        <button class="btn btn-primary report-print-btn" onclick="imprimirRelatorio()" aria-label="Imprimir ou guardar relatório em PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
          Imprimir / guardar PDF
        </button>
      </div>

      <div class="period-row no-print">
        <div class="period-btn ${periodo==='mes' ? 'active' : ''}" onclick="setRelatorioPeriodo('mes')">Mensal</div>
        <div class="period-btn ${periodo==='dia' ? 'active' : ''}" onclick="setRelatorioPeriodo('dia')">Diário</div>
        <div class="period-btn ${periodo==='semana' ? 'active' : ''}" onclick="setRelatorioPeriodo('semana')">Semanal</div>
      </div>

      <div class="print-area card">
        <div class="brand" style="font-size:20px;">Relatório de entregas</div>
        <div class="brand-sub" style="margin-bottom:4px;">Entregador: <strong>${escapeHtml(m.nome)}</strong></div>
        <div class="brand-sub" style="margin-bottom:20px;">${periodoLabel(periodo)}${inicio || fim ? ` · Turno: ${inicio || '00:00'} às ${fim || '23:59'}` : ''}</div>

        <div class="section-title">Entregas</div>
        <div class="table-scroll"><table class="report-table">
          <thead><tr><th>Data/hora</th><th>Cliente</th><th>Tipo</th><th>Valor</th></tr></thead>
          <tbody>${linhasEntregas}</tbody>
        </table></div>

        <div class="section-title">Descontos</div>
        <div class="table-scroll"><table class="report-table">
          <thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead>
          <tbody>${linhasDescontos}</tbody>
        </table></div>

        <div class="report-total-row"><span>Total bruto</span><span>${formatMoney(totalBruto)}</span></div>
        <div class="report-total-row"><span>Total de descontos</span><span>- ${formatMoney(totalDesc)}</span></div>
        <div class="report-total-row net"><span>Total a pagar</span><span>${formatMoney(totalLiquido)}</span></div>

        <div class="footer-note" style="text-align:left; margin-top:20px;">Gerado em ${formatHorario(new Date().toISOString())}</div>
      </div>
    </div>
  `;
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(str){ return escapeHtml(str).replace(/`/g, '&#96;'); }

// captura o valor digitado enquanto o utilizador escreve, para não se perder ao voltar a renderizar
document.addEventListener('input', function(ev){
  const id = ev.target.id;
  if(id === 'driverNameInput') state.driverInput = ev.target.value;
  if(id === 'clienteInput') state.novoCliente = ev.target.value;
  if(id && id.startsWith('editClienteInput_')) state.editCliente = ev.target.value;
  if(id && id.startsWith('descDescricao_')) state.descInputs['d_' + id.split('_')[1]] = ev.target.value;
  if(id && id.startsWith('descValor_')) state.descInputs['v_' + id.split('_')[1]] = ev.target.value;
});

(async function init(){
  await inicializarFirebase();
})();
</script>
</body>
</html>
